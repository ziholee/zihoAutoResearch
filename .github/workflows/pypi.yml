name: Publish verified release to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to retry (vMAJOR.MINOR.PATCH); run from dev'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      vars.PYPI_PUBLISH_ENABLED == 'true' &&
      github.repository == 'ziholee/zihoAutoResearch' &&
      ((github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Resolve exact published release and tag commit
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Only stable vMAJOR.MINOR.PATCH tags are allowed')
          if os.environ['EVENT_NAME'] == 'release' and os.environ['EVENT_REF'] != 'refs/tags/' + tag:
              raise SystemExit('Release event must reference the exact tag')
          PY
          gh api "repos/ziholee/zihoAutoResearch/releases/tags/$RELEASE_TAG" > release.json
          git -C tooling fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" "+refs/heads/dev:refs/remotes/origin/dev"
          commit=$(git -C tooling rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git -C tooling merge-base --is-ancestor "$commit" refs/remotes/origin/dev
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.identity.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Verify public release assets against tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          args=()
          if [[ -n "$RELEASE_ID" ]]; then args+=(--release-id "$RELEASE_ID"); fi
          python tooling/scripts/verify_release_assets.py --tag "$RELEASE_TAG" \
            --release-json release.json "${args[@]}" --checkout source \
            --assets downloaded --output dist --download
      - name: Run installed wheel and source distribution scenarios
        run: python tooling/scripts/verify_package.py --dist dist --checkout source
      - name: Preserve only the verified distribution files
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ziho-autoresearch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist/
          merge-multiple: true
      - name: Publish the verified bytes using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true
