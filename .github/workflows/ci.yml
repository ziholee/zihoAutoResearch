name: Contract CI
on:
  pull_request:
  push:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Measure local CI environment
        run: python scripts/profile_ci_environment.py --output "${{ runner.temp }}/zar-ci-costs/environment.json"
      - name: Preserve environment probe before integration tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-environment-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/zar-ci-costs/environment.json
          retention-days: 7
      - run: python -m unittest discover -s tests -v
        env:
          ZAR_CI_COST_DIR: ${{ runner.temp }}/zar-ci-costs
      - name: Preserve numeric CI cost diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-costs-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/zar-ci-costs/*.json
          if-no-files-found: warn
          retention-days: 7
  contracts:
    name: Document contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/check_contract.py
  package:
    name: Installed package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/verify_package.py --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  gate:
    name: Contract gate
    if: ${{ always() }}
    needs: [tests, contracts, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          PACKAGE: ${{ needs.package.result }}
        run: test "$TESTS" = success && test "$CONTRACTS" = success && test "$PACKAGE" = success
