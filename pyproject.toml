[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ziho-autoresearch"
version = "0.1.1"
description = "Lightweight local ML project records and validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/ziholee/zihoAutoResearch"
Issues = "https://github.com/ziholee/zihoAutoResearch/issues"
Documentation = "https://github.com/ziholee/zihoAutoResearch/blob/dev/README.md"

[project.scripts]
zar = "zar.cli:main"

[tool.setuptools]
packages = ["zar"]

[tool.setuptools.package-data]
zar = ["program.md"]
