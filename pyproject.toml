[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziho-autoresearch"
version = "0.1.0"
description = "Lightweight local ML project records and validation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zar = "zar.cli:main"

[tool.setuptools]
packages = ["zar"]

[tool.setuptools.package-data]
zar = ["program.md"]
